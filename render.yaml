# Render Blueprint: free Docker web service. Free instances have no persistent disk,
# so set the LITESTREAM_* variables to keep the SQLite database in free object storage.
services:
  - type: web
    name: cyberpath-academy
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: ENABLE_DEMO_BILLING
        value: true
      - key: MAIL_MODE
        value: console
      - key: DEFAULT_LOCALE
        value: en
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
